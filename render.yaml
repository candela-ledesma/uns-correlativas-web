services:
  - type: web
    name: uns-correlativas-web
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - { key: PARSER_API_URL, sync: false }
      - { key: AUTH_SECRET, sync: false }
      - { key: DATABASE_URL, sync: false }
    plan: free

  - type: web
    name: uns-parser-api
    runtime: python
    rootDir: parser
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn parser_api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - { key: GEMINI_API_KEY, sync: false }
    plan: free
